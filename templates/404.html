{% extends "base.html" %}

{% block title %}Page non trouvée - 404{% endblock %}

{% block content %}
<div class="text-center py-16 sm:py-24 space-y-4">
    <div class="w-20 h-20 rounded-3xl bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto text-3xl font-black">
        404
    </div>
    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Page introuvable</h1>
    <p class="text-sm text-slate-500 max-w-md mx-auto">La page ou la ressource que vous recherchez n'existe pas ou a été déplacée.</p>
    <div class="pt-4">
        <a href="{{ url_for('index') }}" class="inline-flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm px-5 py-3 rounded-2xl shadow-md transition">
            <i data-lucide="home" class="w-4 h-4"></i>
            <span>Retour à l'accueil</span>
        </a>
    </div>
</div>
{% endblock %}
