{% extends "base.html" %}

{% block title %}Connexion Professeur - Espace Mathématiques & Sciences{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8 sm:my-16">
    <div class="bg-white rounded-3xl shadow-xl border border-slate-200/80 p-8 sm:p-10 space-y-6">
        
        <div class="text-center space-y-2">
            <div class="w-16 h-16 rounded-3xl bg-gradient-to-br from-indigo-600 to-purple-700 text-white flex items-center justify-center mx-auto shadow-lg shadow-indigo-500/20">
                <i data-lucide="lock" class="w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900">Espace Enseignant</h1>
            <p class="text-xs text-slate-500">Connectez-vous pour déposer des cours, gérer les classes et valider les propositions d'élèves.</p>
        </div>

        <form action="{{ url_for('admin_login') }}" method="POST" class="space-y-4">
            <input type="hidden" name="next" value="{{ next }}">

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Identifiant</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </div>
                    <input type="text" name="username" required placeholder="dgimenez" value="dgimenez" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Mot de passe</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="key" class="w-4 h-4"></i>
                    </div>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white font-extrabold text-sm shadow-lg shadow-indigo-500/25 transition">
                    Accéder au mode administrateur
                </button>
            </div>
        </form>

        <div class="pt-4 border-t border-slate-100 text-center">
            <a href="{{ url_for('index') }}" class="text-xs font-semibold text-slate-500 hover:text-indigo-600 flex items-center justify-center gap-1">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                <span>Retour à l'accueil du site</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
